name: leasy_ops_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  google_sign_in: ^6.2.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.13.1


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/icon_background.png" 
  adaptive_icon_foreground: "assets/icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/Google.svg
    - assets/logo_leasy_editable_blanco.svg
    - assets/logo_leasy_azul.svg
    - assets/logo_leasy_editable_azul.svg
    - assets/logo_editable_leasy_fondoazul.svg
    - assets/image.png
    - assets/icon.png
    - assets/icon_background.png
    - assets/icon_foreground.png
    - assets/home.svg
    - assets/history.svg
    - assets/user.svg
    - assets/List.svg
    - assets/Bell.svg
    - assets/plus.svg
    - assets/check.svg
    - assets/entrega.svg
    - assets/GasPump.svg
    - assets/traslado.svg
    - assets/car.svg
    - assets/gestiones.svg
    - assets/notaria.svg
    - assets/verificar.svg
    - assets/alarm.svg
    - assets/warning.svg
    - assets/CalendarCheck.svg
    - assets/task_data.json
